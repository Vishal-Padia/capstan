[project]
name = "capstan"
version = "0.0.1"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy"]

[project.scripts]
capstan = "capstan.cli:main"

[project.entry-points."vllm.general_plugins"]
capstan = "capstan.adapters.vllm_omni:register"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
